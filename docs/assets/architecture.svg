<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">AI Document and Proposal Assistant architecture</title><desc id="desc">Approved documents flow through secure ingestion, retrieval, deterministic pricing, proposal generation, n8n manager review and SQLite audit storage.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#3b82f6"/></marker><style>.title{font:700 34px Arial,sans-serif;fill:#0f2947}.subtitle{font:18px Arial,sans-serif;fill:#536579}.box{fill:#fff;stroke:#2766a8;stroke-width:2}.head{font:700 20px Arial,sans-serif;fill:#0f2947}.body{font:15px Arial,sans-serif;fill:#3e5063}.flow{stroke:#3b82f6;stroke-width:3;fill:none;marker-end:url(#arrow)}.store{fill:#eef6ff;stroke:#2766a8;stroke-width:2}.guard{fill:#fff7e6;stroke:#cf7b00;stroke-width:2}</style></defs>
  <rect width="1200" height="680" fill="#f7fafc"/><text x="60" y="62" class="title">AI Document &amp; Proposal Assistant</text><text x="60" y="94" class="subtitle">Evidence-backed proposals with deterministic pricing and mandatory manager approval</text>
  <rect x="55" y="155" width="240" height="130" rx="16" class="box"/><text x="80" y="192" class="head">Approved documents</text><text x="80" y="224" class="body">PDF · DOCX · XLSX · CSV</text><text x="80" y="250" class="body">Type, path and archive checks</text>
  <rect x="355" y="155" width="240" height="130" rx="16" class="box"/><text x="380" y="192" class="head">Ingestion &amp; RAG</text><text x="380" y="224" class="body">Normalize · chunk · embed</text><text x="380" y="250" class="body">Source metadata · top-k evidence</text>
  <rect x="655" y="155" width="240" height="130" rx="16" class="guard"/><text x="680" y="192" class="head">Python pricing</text><text x="680" y="224" class="body">Approved service catalogue</text><text x="680" y="250" class="body">Decimal · discount · VAT</text>
  <rect x="955" y="155" width="190" height="130" rx="16" class="box"/><text x="980" y="192" class="head">Proposal</text><text x="980" y="224" class="body">English DOCX</text><text x="980" y="250" class="body">Verified PDF</text>
  <path d="M295 220 H345" class="flow"/><path d="M595 220 H645" class="flow"/><path d="M895 220 H945" class="flow"/>
  <rect x="355" y="370" width="240" height="135" rx="16" class="store"/><text x="380" y="407" class="head">SQLite storage</text><text x="380" y="439" class="body">Requests · proposals</text><text x="380" y="465" class="body">Decisions · audit events</text>
  <rect x="655" y="370" width="240" height="135" rx="16" class="box"/><text x="680" y="407" class="head">n8n orchestration</text><text x="680" y="439" class="body">Request · error routing</text><text x="680" y="465" class="body">Gmail manager notification</text>
  <rect x="955" y="370" width="190" height="135" rx="16" class="guard"/><text x="980" y="407" class="head">Manager review</text><text x="980" y="439" class="body">Approve / Reject</text><text x="980" y="465" class="body">No client delivery</text>
  <path d="M1050 285 V360" class="flow"/><path d="M895 437 H945" class="flow"/><path d="M655 437 H605" class="flow"/><path d="M475 360 V295 H775 V360" class="flow"/>
  <rect x="55" y="555" width="1090" height="82" rx="14" fill="#0f2947"/>
  <text x="80" y="587" style="font:700 17px Arial,sans-serif;fill:#fff">Safety boundary: AI may draft text and suggest service codes.</text>
  <text x="80" y="615" style="font:700 17px Arial,sans-serif;fill:#fff">Python and SQLite remain authoritative for facts, money, status and audit history.</text>
</svg>
