<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Manager approval workflow</title><desc id="desc">A request creates a pending draft. Approve finalizes while Reject blocks finalization. Repeated and opposite actions are handled safely.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#3b82f6"/></marker><style>.b{fill:#fff;stroke:#2766a8;stroke-width:2}.g{fill:#eaf8ef;stroke:#168348;stroke-width:2}.r{fill:#fff0f0;stroke:#bc3b3b;stroke-width:2}.t{font:700 18px Arial,sans-serif;fill:#102a43}.s{font:14px Arial,sans-serif;fill:#52667a}.l{stroke:#3b82f6;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="430" fill="#f7fafc"/><text x="55" y="55" style="font:700 32px Arial,sans-serif;fill:#0f2947">Controlled manager approval</text>
  <rect x="55" y="120" width="190" height="100" rx="15" class="b"/><text x="80" y="158" class="t">Client request</text><text x="80" y="187" class="s">Validated input</text>
  <rect x="300" y="120" width="205" height="100" rx="15" class="b"/><text x="325" y="158" class="t">Generate draft</text><text x="325" y="187" class="s">DOCX + PDF</text>
  <rect x="560" y="120" width="205" height="100" rx="15" class="b"/><text x="585" y="158" class="t">Pending approval</text><text x="585" y="187" class="s">Manager email only</text>
  <rect x="845" y="80" width="290" height="100" rx="15" class="g"/><text x="870" y="118" class="t">Approve</text><text x="870" y="147" class="s">approved · can_finalize=true</text>
  <rect x="845" y="245" width="290" height="100" rx="15" class="r"/><text x="870" y="283" class="t">Reject</text><text x="870" y="312" class="s">rejected · finalization blocked</text>
  <path d="M245 170 H290" class="l"/><path d="M505 170 H550" class="l"/><path d="M765 155 C805 155 805 130 835 130" class="l"/><path d="M765 185 C805 185 805 295 835 295" class="l"/>
  <text x="55" y="382" style="font:700 15px Arial,sans-serif;fill:#52667a">Replay safety: identical actions return the stored decision; opposite actions return HTTP 409.</text>
  <text x="55" y="407" style="font:700 15px Arial,sans-serif;fill:#52667a">SQLite stores one decision and one audit event.</text>
</svg>
